[project]
name = "ai-data-analytics-backend"
version = "0.1.0"
description = "AI Data Analytics Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.2",
    "plotly>=5.20.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.6.0",
    "requests>=2.31.0",
    "google-genai>=0.1.1",
    "python-dotenv>=1.0.1",
]

[tool.vercel]
entrypoint = "main:app"